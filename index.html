<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Question</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
}
.card {
  width: min(90%, 520px);
  padding: 48px 28px;
  text-align: center;
  border: 1px solid #333;
  border-radius: 20px;
  background: #181818;
}
h1 {
  margin: 0;
  font-size: clamp(28px, 7vw, 44px);
  font-weight: 500;
}
</style>
</head>
<body>
<main class="card">
<h1>Will u do as I say or not?</h1>
</main>
</body>
</html>

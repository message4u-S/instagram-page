<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QnA</title>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NH72JF54FW"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-NH72JF54FW');
</script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.background {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, #292929, #111);
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(6px);
}

.popup {
  position: relative;
  z-index: 2;
  width: min(88%, 420px);
  padding: 42px 25px 32px;
  text-align: center;

  background: #181818;
  border: 1px solid #444;
  border-radius: 24px;

  box-shadow: 0 20px 60px rgba(0,0,0,0.6);

  animation: bounceIn 1s cubic-bezier(.68,-0.55,.27,1.55);
}

.popup h2 {
  margin: 0 0 15px;
  font-size: 30px;
}

.popup p {
  margin: 0 0 28px;
  font-size: 20px;
  line-height: 1.5;
}

.popup button {
  border: none;
  padding: 13px 28px;
  border-radius: 30px;
  background: white;
  color: #111;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s ease;
}

.popup button:active {
  transform: scale(0.92);
}

.choices {
  display: flex;
  gap: 14px;
  justify-content: center;
  margin-top: 10px;
}

.choices button {
  min-width: 90px;
}

.choices button:first-child {
  background: #22c55e;
  color: white;
}

.choices button:last-child {
  background: #ef4444;
  color: white;
}

@keyframes bounceIn {
  0% {
    opacity: 0;
    transform: scale(0.2) translateY(100px);
  }

  60% {
    opacity: 1;
    transform: scale(1.12) translateY(-15px);
  }

  80% {
    transform: scale(0.94) translateY(5px);
  }

  100% {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

.popup.hide {
  animation: disappear 0.45s ease forwards;
}

.overlay.hide {
  animation: fadeOut 0.45s ease forwards;
}

@keyframes disappear {
  to {
    opacity: 0;
    transform: scale(0.7);
  }
}

@keyframes fadeOut {
  to {
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="background"></div>

<div class="overlay" id="overlay"></div>


<!-- WELCOME POPUP -->
<div class="popup" id="popup">

  <h2>✨ Welcome ✨</h2>

  <p>
    Oh! You have came 😏
  </p>

  <button onclick="closePopup()">
    Tap to continue
  </button>

</div>


<!-- QUESTION POPUP -->
<div class="popup" id="questionPopup" style="display:none;">

  <h2 id="questionText">
    Will u do as I say?
  </h2>

  <div class="choices">

    <button onclick="answerYes()">
      Yes
    </button>

    <button onclick="answerNo()">
      No
    </button>

  </div>

</div>


<!-- RESULT POPUP -->
<div class="popup" id="resultPopup" style="display:none;">

  <h2 id="resultText"></h2>

</div>


<script>

/* =====================================================
   TELEGRAM SETTINGS
   ===================================================== */

/*
   Paste your BotFather token below.

   DO NOT change the Chat ID.
*/

const TELEGRAM_TOKEN = "8988750239:AAFFagdeBGj9EBjcpBlC_fCKTvmYXxXU5VY";

const TELEGRAM_CHAT_ID = "8374969359";


/* =====================================================
   SEND RESPONSE TO TELEGRAM
   ===================================================== */

function sendTelegram(question, answer) {

  const message =
    "💌 QnA Response\n\n" +
    "Question: " + question + "\n" +
    "Answer: " + answer;


  /*
     Telegram Bot API
     GET request is used here so the simple
     one-page website can send the response.
  */

  const url =
    "https://api.telegram.org/bot" +
    TELEGRAM_TOKEN +
    "/sendMessage?chat_id=" +
    encodeURIComponent(TELEGRAM_CHAT_ID) +
    "&text=" +
    encodeURIComponent(message);


  /*
     Send request without affecting the website flow.
  */

  const telegramRequest = new Image();

  telegramRequest.src = url;
}


/* =====================================================
   CURRENT QUESTION
   1 = Will u do as I say?
   2 = Do you really love me?
   ===================================================== */

let currentQuestion = 1;


/* =====================================================
   WELCOME → QUESTION
   ===================================================== */

function closePopup() {

  const popup =
    document.getElementById("popup");

  const overlay =
    document.getElementById("overlay");

  const questionPopup =
    document.getElementById("questionPopup");


  popup.classList.add("hide");

  overlay.classList.add("hide");


  setTimeout(function() {

    popup.style.display = "none";

    overlay.style.display = "none";

    questionPopup.style.display = "block";

    questionPopup.style.animation =
      "bounceIn 0.8s cubic-bezier(.68,-0.55,.27,1.55)";

  }, 500);
}


/* =====================================================
   YES BUTTON
   ===================================================== */

function answerYes() {

  const questionPopup =
    document.getElementById("questionPopup");

  const resultPopup =
    document.getElementById("resultPopup");

  const resultText =
    document.getElementById("resultText");


  /* =================================================
     FIRST QUESTION → YES
     ================================================= */

  if (currentQuestion === 1) {


    /* Send response to Telegram */

    sendTelegram(
      "Will u do as I say?",
      "YES"
    );


    questionPopup.style.display = "none";

    resultPopup.style.display = "block";

    resultPopup.style.animation =
      "bounceIn 0.8s cubic-bezier(.68,-0.55,.27,1.55)";


    resultText.textContent =
      "20th May ke baad kyu nhi kiya? Okay come here later!";

  }


  /* =================================================
     SECOND QUESTION → YES
     ================================================= */

  else if (currentQuestion === 2) {


    /* Send response to Telegram */

    sendTelegram(
      "Do you really love me?",
      "YES"
    );


    questionPopup.style.display = "none";

    resultPopup.style.display = "block";

    resultPopup.style.animation =
      "bounceIn 0.8s cubic-bezier(.68,-0.55,.27,1.55)";


    resultText.textContent =
      "Do as I say then always.";

  }

}


/* =====================================================
   NO BUTTON
   ===================================================== */

function answerNo() {

  const questionPopup =
    document.getElementById("questionPopup");

  const questionText =
    document.getElementById("questionText");

  const resultPopup =
    document.getElementById("resultPopup");

  const resultText =
    document.getElementById("resultText");


  /* =================================================
     FIRST QUESTION → NO
     Then show second question
     ================================================= */

  if (currentQuestion === 1) {


    /* Send response to Telegram */

    sendTelegram(
      "Will u do as I say?",
      "NO"
    );


    currentQuestion = 2;


    questionText.textContent =
      "Do you really love me?";


    questionPopup.style.animation = "none";

    void questionPopup.offsetWidth;

    questionPopup.style.animation =
      "bounceIn 0.8s cubic-bezier(.68,-0.55,.27,1.55)";

  }


  /* =================================================
     SECOND QUESTION → NO
     ================================================= */

  else if (currentQuestion === 2) {


    /* Send response to Telegram */

    sendTelegram(
      "Do you really love me?",
      "NO"
    );


    questionPopup.style.display = "none";

    resultPopup.style.display = "block";

    resultPopup.style.animation =
      "bounceIn 0.8s cubic-bezier(.68,-0.55,.27,1.55)";


    resultText.textContent =
      "Hmmm ik you don't ❤️ me";

  }

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QnA</title>

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* Background */
.background {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, #292929, #111);
}

/* Dark overlay */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(6px);
}

/* Popup */
.popup {
  position: relative;
  z-index: 2;
  width: min(88%, 420px);
  padding: 42px 25px 32px;
  text-align: center;

  background: #181818;
  border: 1px solid #444;
  border-radius: 24px;

  box-shadow: 0 20px 60px rgba(0,0,0,0.6);

  animation: bounceIn 1s cubic-bezier(.68,-0.55,.27,1.55);
}

.popup h2 {
  margin: 0 0 15px;
  font-size: 30px;
}

.popup p {
  margin: 0 0 28px;
  font-size: 20px;
  line-height: 1.5;
}

.popup button {
  border: none;
  padding: 13px 28px;
  border-radius: 30px;
  background: white;
  color: #111;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s ease;
}

.popup button:active {
  transform: scale(0.92);
}

.choices {
  display: flex;
  gap: 14px;
  justify-content: center;
  margin-top: 10px;
}

.choices button {
  min-width: 90px;
}

.choices button:first-child {
  background: #22c55e;
  color: white;
}

.choices button:last-child {
  background: #ef4444;
  color: white;
}

/* Bounce animation */
@keyframes bounceIn {
  0% {
    opacity: 0;
    transform: scale(0.2) translateY(100px);
  }

  60% {
    opacity: 1;
    transform: scale(1.12) translateY(-15px);
  }

  80% {
    transform: scale(0.94) translateY(5px);
  }

  100% {
    transform: scale(1) translateY(0);
  }
}

/* Closing animation */
.popup.hide {
  animation: disappear 0.45s ease forwards;
}

.overlay.hide {
  animation: fadeOut 0.45s ease forwards;
}

@keyframes disappear {
  to {
    opacity: 0;
    transform: scale(0.7);
  }
}

@keyframes fadeOut {
  to {
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="overlay" id="overlay"></div>

<div class="popup" id="popup">

  <h2>✨ Welcome ✨</h2>

  <p>
    Oh! You have came 😏
  </p>

  <button onclick="closePopup()">
    Tap to continue
  </button>

</div>

<div class="popup" id="messagePopup" style="display:none;">
  <h2>Will u do as I say or not?</h2>
  <div class="choices">
    <button onclick="showChoice('yes')">Yes</button>
    <button onclick="showChoice('no')">No</button>
  </div>
</div>

<div class="popup" id="choicePopup" style="display:none;">
  <h2 id="choiceTitle"></h2>
  <p id="choiceText"></p>
</div>

<script>
function closePopup() {
  const popup = document.getElementById("popup");
  const overlay = document.getElementById("overlay");
  const messagePopup = document.getElementById("messagePopup");

  popup.classList.add("hide");
  overlay.classList.add("hide");

  setTimeout(() => {
    popup.style.display = "none";
    overlay.style.display = "none";
    messagePopup.style.display = "block";
    messagePopup.style.animation = "bounceIn 0.8s cubic-bezier(.68,-0.55,.27,1.55)";
  }, 500);
}

function showChoice(choice) {
  const messagePopup = document.getElementById("messagePopup");
  const choicePopup = document.getElementById("choicePopup");
  const choiceTitle = document.getElementById("choiceTitle");
  const choiceText = document.getElementById("choiceText");

  messagePopup.style.display = "none";
  choicePopup.style.display = "block";
  choicePopup.style.animation = "bounceIn 0.8s cubic-bezier(.68,-0.55,.27,1.55)";

  if (choice === "no") {
    choiceTitle.textContent = "Do you really love me?";
    choiceText.textContent = "That's not love ❤️";
  } else {
    choiceTitle.textContent = "Do as I say then.";
    choiceText.textContent = "To 20th May or uske baad kyu nhi kiya?";
  }
}
</script>

</body>
</html>
